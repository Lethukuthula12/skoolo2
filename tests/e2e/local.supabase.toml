# Copied into .local/supabase/config.toml by setup. Never push this to hosted Supabase.
project_id = "skoolo-e2e"
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55322
shadow_port = 55320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[realtime]
enabled = true
[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 55324
[storage]
enabled = true
file_size_limit = "50MiB"
[auth]
enabled = true
site_url = "http://localhost:4400"
additional_redirect_urls = ["http://localhost:4400/**", "http://127.0.0.1:4400/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8
[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_refresh = 1000
token_verifications = 1000
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
[analytics]
enabled = false
[edge_runtime]
enabled = false
